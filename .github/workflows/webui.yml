name: SnowCast explorer
on:
  pull_request:
    paths: ['snowcast_runner/**', 'met/**', 'projects/**', 'pyproject.toml', 'webui/**', 'postprocess/**', 'config_hrdps_west.py', 'webupload/**', 'scripts/**', 'tests/**', '.github/workflows/webui.yml']
  push:
    branches: [develop]
    paths: ['snowcast_runner/**', 'met/**', 'projects/**', 'pyproject.toml', 'webui/**', 'postprocess/**', 'config_hrdps_west.py', 'webupload/**', 'scripts/**', 'tests/**', '.github/workflows/webui.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest
      - run: python -m pytest -q tests
      - run: npm ci && npm run check && npm test && npm run build
        working-directory: webui
