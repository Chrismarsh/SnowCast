[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowcast-runner"
version = "0.2.0"
description = "Run and postprocess independent CHM projects"
requires-python = ">=3.10"
dependencies = ["json5>=0.9", "numpy", "rasterio>=1.4,<2", "xarray", "netCDF4"]

[project.scripts]
snowcast = "snowcast_runner.cli:main"

[tool.setuptools.packages.find]
include = ["snowcast_runner*", "postprocess*", "webupload*"]
namespaces = true
